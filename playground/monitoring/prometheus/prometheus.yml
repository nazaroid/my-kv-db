global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # KV Database Service
  - job_name: 'kvdb'
    static_configs:
      - targets: ['kvdb:9091']
    scrape_interval: 10s
    scrape_timeout: 5s

  # Grafana (optional - if you want to monitor Grafana itself)
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics
    scrape_interval: 30s
